version: '3'

env:
  GOWORK: 'off'

tasks:
  default:
    desc: 'Default task runs the "test" and "build" tasks'
    deps:
      - test
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy
      - go -C examples mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...
      - go -C examples get -u ./...

  test:
    desc: 'Run all Go tests'
    cmds:
      - go test -mod=readonly ./...
      - go -C examples test -mod=readonly ./...

  build:
    desc: 'Build all the things'
    deps:
      - build-examples

  clean:
    desc: 'Clean built examples'
    cmds:
      - rm -f bin/ntcharts-osm-mapview bin/ntcharts-osm-mapview3d
      - rm -rf .task

###############################################################################
# Examples

  build-examples:
    desc: 'Build all examples'
    deps:
      - build-ex-mapview
      - build-ex-mapview3d

  bench-mapview3d:
    desc: 'Measure 3D software rendering and texture replacement without network or terminal I/O'
    cmds:
      - go -C examples test -run '^$' -bench BenchmarkMap3D -benchmem -benchtime=1s -count=3 ./mapview3d

  bench-mapview3d-gpu:
    desc: 'Measure native GPU map snapshots; fail if rendering falls back to software'
    cmds:
      - go -C examples test -tags webgpu -run '^$' -bench '^BenchmarkMap3DGPU$' -benchmem -benchtime=144x -count=3 ./mapview3d

  build-ex-mapview3d:
    desc: 'Build the textured 3D map example'
    cmds:
      - go -C examples build -mod=readonly -o ../bin/ntcharts-osm-mapview3d ./mapview3d

  build-ex-mapview:
    desc: 'Build the mapview example'
    cmds:
      - go -C examples build -mod=readonly -o ../bin/ntcharts-osm-mapview ./mapview
    sources:
      - mapview/**/*.go
      - examples/mapview/*.go
      - go.mod
      - go.sum
      - examples/go.mod
      - examples/go.sum
      - examples/internal/**/*.go
    generates:
      - bin/ntcharts-osm-mapview

###############################################################################
# Demo gif (note: Kitty graphics do not render in VHS — this captures the
# half-block path only; do a hand-made recording for Kitty-mode demos).

  vhs-validate:
    desc: 'Validate vhs tape file'
    cmds:
      - vhs validate ./examples/mapview/demo.tape

  vhs:
    desc: 'Generate gif via vhs'
    deps:
      - build-ex-mapview
    cmds:
      - vhs --output ./examples/mapview/demo.gif ./examples/mapview/demo.tape

###############################################################################
# Demo website via booba

  build-wasm:
    desc: 'Build both browser demos'
    env:
      GOWORK: '{{.ROOT_DIR}}/wasm.work'
      GOOS: js
      GOARCH: wasm
      CGO_ENABLED: '0'
    cmds:
      - mkdir -p web/demos
      - for: [mapview, mapview3d]
        cmd: go -C examples build -mod=readonly -o ../web/demos/{{.ITEM}}.wasm ./{{.ITEM}}

  build-wasm-site:
    desc: 'Build demos and export the pinned booba runtime'
    cmds:
      - task: build-wasm
      - go -C examples tool booba-assets --no-index ../web/
      - cp LICENSE.txt web/LICENSE
      - cp THIRD_PARTY_NOTICES.md web/

  check-site:
    desc: 'Validate browser assets and exercise both WASM demos'
    cmds:
      - node --check web/site.js
      - node scripts/check-site.mjs
      - for: [mapview, mapview3d]
        cmd: node scripts/smoke-demo.mjs {{.ITEM}}

  serve-wasm-site:
    desc: 'Serve at http://localhost:8000/ntcharts-osm/'
    deps: [build-wasm-site]
    vars:
      SERVE_DIR: /tmp/ntcharts-osm-site
    cmds:
      - mkdir -p "{{.SERVE_DIR}}"
      - ln -sfn "$PWD/web" "{{.SERVE_DIR}}/ntcharts-osm"
      - python3 -m http.server 8000 --directory "{{.SERVE_DIR}}"

  clean-wasm-site:
    desc: 'Remove generated browser artifacts'
    cmds:
      - rm -rf web/booba web/ghostty-web web/demos
      - rm -f web/app.wasm web/wasm_exec.js web/LICENSE web/THIRD_PARTY_NOTICES.md

  notices:
    desc: 'Regenerate dependency licenses for native and browser demos'
    cmds:
      - go run ./internal/tools/notices > THIRD_PARTY_NOTICES.md

  ci:
    desc: 'Check formatting, dependencies, native tests, and browser demos'
    cmds:
      - test -z "$(gofmt -l mapview examples internal)"
      - go mod tidy -diff
      - go -C examples mod tidy -diff
      - go mod verify
      - go -C examples mod verify
      - go test -mod=readonly -race ./...
      - go -C examples test -mod=readonly -race ./...
      - go vet -mod=readonly ./...
      - go -C examples vet -mod=readonly ./...
      - task: build
      - task: build-wasm-site
      - task: check-site
      - go run ./internal/tools/notices | cmp -s - THIRD_PARTY_NOTICES.md
