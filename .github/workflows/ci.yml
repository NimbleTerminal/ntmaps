name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            go.sum
            examples/go.sum
            wasm.work.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: go-task/setup-task@v2
      - run: task ci
